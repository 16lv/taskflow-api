services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow_local_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/taskflow
      DATABASE_USER: taskflow
      DATABASE_PASSWORD: taskflow_local_password
      JWT_SECRET: taskflow-local-docker-hmac256-secret-key-at-least-32-bytes
    depends_on:
      postgres:
        condition: service_healthy
